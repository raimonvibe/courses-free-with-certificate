# Weekly check of every course link in src/data/courses.ts.
# A broken or removed course opens (or updates) one issue, so a dead link is
# noticed without anyone having to click through the site.
name: Course link check

on:
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC, with the other weekly scans
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check course links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/999: providers that block automated checks but are up.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429,999
            src/data/courses.ts
          output: lychee-report.md
          fail: false

      - name: Open an issue when a link is broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Course link check: broken links found"
          content-filepath: lychee-report.md
          labels: links
